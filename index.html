<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RisparmiTop - Offerte del momento</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin-top: 10px;
            color: #d1d5db;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }

        .old-price {
            color: #888;
            text-decoration: line-through;
        }

        .discount {
            color: #16a34a;
            font-weight: bold;
        }

        .category {
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #ff9900;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>🔥 RisparmiTop</h1>
    <p>Le offerte più interessanti, selezionate per te.</p>
</header>

<main>

    <div class="intro">
        <h2>🛒 Offerte del momento</h2>
        <p>Scopri le occasioni che abbiamo trovato.</p>
    </div>

    <div id="offers">
        <p>Caricamento offerte...</p>
    </div>

</main>

<footer>
    © 2026 RisparmiTop
</footer>

<script>
function formatDate(dateString) {

    // Interpreta la data come orario italiano
    let date = new Date(dateString);

    if (!dateString.includes("Z") && !dateString.includes("+")) {
        date = new Date(dateString + "Z");
    }

    const formatted = new Intl.DateTimeFormat("it-IT", {
        timeZone: "Europe/Rome",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    }).formatToParts(date);

    const parts = {};

    formatted.forEach(part => {
        parts[part.type] = part.value;
    });

    return `${parts.day}/${parts.month}/${parts.year} delle ore ${parts.hour}.${parts.minute}`;
}

async function loadOffers() {

    const response = await fetch(
        "https://raw.githubusercontent.com/antosic1980/risparmitop-site/main/offers.json"
    );

    const offers = await response.json();

    const container = document.getElementById("offers");

    container.innerHTML = "";

    offers.forEach(offer => {

        const discount = Math.round(
            ((offer.old_price - offer.price) / offer.old_price) * 100
        );

        if (discount < 30) {
            return;
        }

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <h2>📦 ${offer.name}</h2>

            <p class="category">
                🏷️ ${offer.category}
            </p>

            <p>
                <span class="old-price">
                    €${offer.old_price.toFixed(2)}
                </span>
            </p>

            <p class="price">
                €${offer.price.toFixed(2)}
            </p>

            <p class="discount">
                📉 -${discount}%
            </p>

            <p>
                📅 Offerta del ${formatDate(offer.date)}
            </p>

            <a
                class="button"
                href="${offer.url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                👉 Vedi l'offerta
            </a>
        `;

        container.appendChild(card);
    });
}

loadOffers();

</script>

</body>
</html>
